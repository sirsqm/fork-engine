<!doctype html>
<!--
  The page the web window smoke test runs in.

  It provides the #canvas the engine's web backend renders into, then loads the
  Emscripten module. The result of the run is written into the document title by
  the test itself, and the harness reads it back with `chromium --dump-dom`.

  The canvas is sized by the engine (emscripten_set_canvas_element_size), so the
  CSS here only has to give it a box to live in; it must not fight the engine's
  width/height attributes.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fork Engine web window smoke test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
      }
      #canvas {
        display: block;
        width: 320px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <!-- Emscripten replaces this with the module's script tag; it must not be a
         hardcoded <script src>, or the build fails and the module never loads. -->
    {{{ SCRIPT }}}
  </body>
</html>
