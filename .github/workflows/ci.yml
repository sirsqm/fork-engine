name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref; only the latest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC / Debug
            os: ubuntu-latest
            compiler: gcc
            build_type: Debug
          - name: Linux / GCC / Release
            os: ubuntu-latest
            compiler: gcc
            build_type: Release
          - name: macOS / Clang / Debug
            os: macos-latest
            compiler: clang
            build_type: Debug
          - name: Windows / MSVC / Debug
            os: windows-latest
            compiler: msvc
            build_type: Debug

    steps:
      - uses: actions/checkout@v4

      # GLFW (fetched by CMake) needs the X11/Wayland development headers, and
      # the graphics tests need a virtual display plus a software GL driver.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            xvfb \
            mesa-utils

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFE_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 640x480x24" ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Run the sandbox headless (Linux smoke test)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 640x480x24" ./build/bin/fork_sandbox --headless 30

      # Deliberately *not* wrapped in xvfb-run: this is the proof that the null
      # platform backend runs the engine with no display and no GL context
      # (ADR-0041). If it ever needs a virtual display again, the abstraction has
      # sprung a leak.
      - name: Run the headless example with no display (Linux smoke test)
        if: runner.os == 'Linux'
        run: ./build/bin/fork_headless 10

      # The render path with no display and no GPU: the null RHI device
      # (ADR-0042) runs extraction, batching, and draw submission. Also not
      # wrapped in xvfb-run: if it ever needs a virtual display, the null device
      # has sprung a leak.
      - name: Run the headless render path with no display (Linux smoke test)
        if: runner.os == 'Linux'
        run: ./build/bin/fork_headless --render 10

      - name: Run the editor headless over the demo project (Linux smoke test)
        if: runner.os == 'Linux'
        run: |
          # The cold run writes the import cache; the warm run must read it back
          # (ADR-0029). Both must exit cleanly.
          xvfb-run -a -s "-screen 0 640x480x24" ./build/bin/fork_editor_shell --project examples/demo_project --headless --frames 3
          xvfb-run -a -s "-screen 0 640x480x24" ./build/bin/fork_editor_shell --project examples/demo_project --headless --frames 3

      - name: Export the demo project and play it (Linux smoke test)
        if: runner.os == 'Linux'
        run: |
          # The whole shipping path in one step (ADR-0064): fork_export turns a
          # project into a pack, a runtime, and a manifest; fork_player mounts
          # that pack and runs the scene. If either half breaks, this fails.
          ./build/bin/fork_export --project examples/demo_project --out /tmp/fork_export_smoke --module ./build/bin/fe_test_module_a.so
          test -x /tmp/fork_export_smoke/fork_player
          test -f /tmp/fork_export_smoke/fork.export.json
          test -f /tmp/fork_export_smoke/game.fepack
          test -f /tmp/fork_export_smoke/fe_test_module_a.so
          # Run the exported build the way a player would: from its own directory,
          # through its manifest, with no loose project files left behind.
          (cd /tmp/fork_export_smoke && ./fork_player --export . --headless 30)
          (cd /tmp/fork_export_smoke && ./fork_player --export . --headless 10 --render)
          # Pruning (ADR-0065) still produces a playable build: only the scene's
          # referenced assets are packed, so the demo's README and project file
          # are dropped, and the player runs from the pruned pack just the same.
          ./build/bin/fork_export --project examples/demo_project --out /tmp/fork_export_pruned --prune
          (cd /tmp/fork_export_pruned && ./fork_player --export . --headless 30)

      - name: Load a gameplay module in the editor (Linux smoke test)
        if: runner.os == 'Linux'
        run: |
          # The editor loads a real gameplay module named on the command line and
          # exits cleanly (ADR-0061, ADR-0066). The hot-reload path itself is
          # exercised deterministically by editor_tests, which loads two real
          # images, replaces one in place, polls, reloads, and asserts the node
          # runs the new code -- a race against a frame loop would be flaky, so
          # this step only proves the module loads through the shell.
          cp ./build/bin/fe_test_module_a.so /tmp/fork_module_smoke.so
          xvfb-run -a -s "-screen 0 640x480x24" ./build/bin/fork_editor_shell \
              --module /tmp/fork_module_smoke.so --headless --frames 3 2>&1 | tee /tmp/fork_module_smoke.log
          grep -q "loaded module" /tmp/fork_module_smoke.log

  # The performance regression gate
  # (docs/adr/0033-performance-regression-gate.md): a Release build runs the
  # benchmark over a fixed scene and compares its frame-time p50 against the
  # recorded baseline. Linux only, because the benchmark needs a GL context and
  # the runner supplies one via Xvfb + Mesa's software driver. Sanitizers are a
  # separate job (ADR-0035).
  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            xvfb \
            mesa-utils

      # Release, so the numbers reflect an optimised build; the gate compares
      # Release to Release, never across build types.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFE_WARNINGS_AS_ERRORS=ON -DFE_BUILD_EDITOR=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run the benchmark
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/bin/fork_bench --scene sprite_heavy --frames 300 --warmup 60 \
              --json --out benchmark.json

      - name: Check for a regression
        run: python3 benchmarks/check_regression.py --baseline benchmarks/baseline.json --current benchmark.json

      - name: Upload the benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmark.json

  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the exact clang-format version so the check is deterministic and
      # matches what contributors get from `pip install clang-format==23.1.3`.
      # The apt package version varies by runner image, which makes the check
      # flap between releases.
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check formatting
        run: |
          files=$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | grep -v '^third_party/')
          if [ -z "$files" ]; then
            echo "No first-party C++ files to check."
            exit 0
          fi
          clang-format --dry-run --Werror $files

  # ---------------------------------------------------------------------------
  # Sanitizers.
  #
  # A Debug build with -DFE_ENABLE_ASAN=ON (AddressSanitizer + UndefinedBehavior
  # Sanitizer, see CMakeLists.txt) and warnings-as-errors, running the full ctest
  # suite under a virtual display (the graphics tests need a GL context).
  #
  # detect_leaks is set to 0 on purpose. LeakSanitizer's exit-time report is
  # clean for the pure engine and editor tests, but the tests that create a GL
  # context (and the untouched fork_sandbox) report leaks whose stacks are
  # entirely third-party -- Mesa/llvmpipe, GLFW and X11, symbolized only as
  # "<unknown module>" -- with no engine frame involved. Gating on that would
  # leave this job permanently red over allocations the project does not own and
  # cannot free. The remaining sanitizer checks (heap/stack buffer overflow,
  # use-after-free, double-free, and every UBSan check) still run across the
  # whole suite, graphics included. UBSAN_OPTIONS halts on the first finding so
  # UBSan, which prints and continues by default, actually fails the job.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Linux / GCC / Debug + ASan/UBSan
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            xvfb \
            mesa-utils \
            ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-asan-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-asan-ccache-

      - name: Configure (Debug + ASan/UBSan, warnings as errors)
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DFE_ENABLE_ASAN=ON
          -DFE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-asan --parallel

      # Leak detection is left on for the engine and editor tests, where it is
      # clean and meaningful, and off for the full run that includes the GL
      # binaries. Both invocations reuse the same build.
      - name: Test (engine + editor, leak detection on)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure -R 'engine_tests|editor_tests'

      - name: Test (full suite, with a virtual display)
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: xvfb-run -a -s "-screen 0 640x480x24" ctest --test-dir build-asan --output-on-failure

      - name: ccache stats
        if: always()
        run: ccache -s

  # ---------------------------------------------------------------------------
  # ThreadSanitizer (ADR-0068).
  #
  # The job system is the one place the engine starts threads, and ADR-0017 says
  # a concurrency surface "must be run under a thread sanitizer". A Debug build
  # with -DFE_ENABLE_TSAN=ON and warnings-as-errors runs the *pure-logic* tests
  # (fork_engine_tests), which include every jobs test and start real threads.
  #
  # Only the engine tests run, deliberately. TSan instruments every thread, so
  # the GL binaries -- which pull in Mesa/llvmpipe, GLFW and X11 and spawn their
  # own driver threads -- report races entirely inside third-party code, the same
  # way the ASan job excludes their leaks. The X11/Wayland dev packages are
  # installed only because GLFW's CMake requires their headers to configure; no
  # display, xvfb, or GL package is needed, because the engine tests never open a
  # window.
  # ---------------------------------------------------------------------------
  threadsanitizer:
    name: Linux / GCC / Debug + TSan
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-tsan-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-tsan-ccache-

      - name: Configure (Debug + TSan, warnings as errors)
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DFE_ENABLE_TSAN=ON
          -DFE_WARNINGS_AS_ERRORS=ON
          -DFE_BUILD_EDITOR=OFF
          -DFE_BUILD_BENCHMARKS=OFF
          -DFE_BUILD_EXAMPLES=OFF
          -DGLFW_BUILD_WAYLAND=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-tsan --target fork_engine_tests --parallel

      # halt_on_error=1 makes a race fail the job rather than only print.
      - name: Test (pure-logic suite, no display)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure -R 'engine_tests'

      - name: ccache stats
        if: always()
        run: ccache -s

  # ---------------------------------------------------------------------------
  # Warnings-as-errors.
  #
  # A Release-grade configure+build (RelWithDebInfo, so the optimiser is on and
  # optimisation-sensitive warnings still fire) with -DFE_WARNINGS_AS_ERRORS=ON.
  # The purpose is to catch warning regressions on the optimised path, which the
  # Debug matrix jobs do not see; the test matrix above already runs the suite in
  # both Debug and Release, so this job builds only.
  # ---------------------------------------------------------------------------
  warnings:
    name: Linux / GCC / RelWithDebInfo (warnings as errors)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-warnings-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-warnings-ccache-

      - name: Configure (RelWithDebInfo, warnings as errors)
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DFE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: ccache stats
        if: always()
        run: ccache -s
